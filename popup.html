<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Rotator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- Header: Title + Status Badge -->
    <header class="header-row">
      <div class="title-group">
        <h1 class="title">Tab Rotator</h1>
      </div>
      <div id="statusBadge" class="status-badge badge-paused">
        <span class="status-dot"></span>
        <span id="statusText">Paused</span>
      </div>
    </header>

    <!-- Main Tab Confirmation Card -->
    <div class="main-tab-info">
      <span class="main-tab-label">Main Tab:</span>
      <span id="mainTabTitle" class="main-tab-name" title="Designated control tab">Detecting...</span>
    </div>

    <!-- Locked Warning Banner (shown only on non-main tabs) -->
    <div id="lockedNotice" class="locked-banner hidden">
      <svg class="lock-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span>Switch to the main tab to change settings.</span>
    </div>

    <!-- Main Controls Area -->
    <main id="controlsArea" class="controls-area">

      <!-- Start/Stop Toggle Button -->
      <button id="toggleBtn" class="toggle-btn btn-start" type="button">
        Start Rotation
      </button>

      <!-- Settings Inputs -->
      <div class="inputs-group">
        <div class="input-row">
          <label for="cycleDelay" class="input-label">
            Switch every <span class="range-hint">(1–3s)</span>
          </label>
          <div class="input-wrapper">
            <input type="number" id="cycleDelay" class="number-input"
                   min="1" max="3" step="1" value="2">
            <span class="unit-suffix">sec</span>
          </div>
        </div>

        <div class="input-row">
          <label for="revisitInterval" class="input-label">
            Revisit main tab every <span class="range-hint">(5–30m)</span>
          </label>
          <div class="input-wrapper">
            <input type="number" id="revisitInterval" class="number-input"
                   min="5" max="30" step="1" value="10">
            <span class="unit-suffix">min</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Footer helper hint -->
    <footer class="footer-note">
      <span id="footerText">Clicking the main tab manually stops rotation.</span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
